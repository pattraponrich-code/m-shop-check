<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>M-Shop Service Pro Cloud</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        onValue,
        push,
        remove,
        update,
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      const firebaseConfig = {
        /* 🔴 ใช้ config เดิมของคุณ */
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.FDB = {
        db,
        ref,
        set,
        onValue,
        push,
        remove,
        update,
      };
    </script>
  </head>

  <body class="bg-slate-100">
    <div id="app">
      <!-- 🔵 UI ของคุณเหมือนเดิมทั้งหมด -->
    </div>

    <!-- ================== VUE APP ================== -->
    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            isLoggedIn: false,
            passcode: "",
            currentUser: null,
            search: "",
            activeTab: "prices",
            editing: false,
            previewImage: null,
            userEditing: false,
            isNewUser: false,
            oldCode: null,

            brands: [
              "iPhone",
              "Samsung",
              "Oppo",
              "Vivo",
              "Realme",
              "Redmi",
              "Xiaomi",
              "Infinix",
              "Tecno",
              "iPad",
              "อื่นๆ",
            ],

            userAccounts: {
              9988: { name: "เจ้าของร้าน", role: "Owner" },
            },

            models: [],
            logs: [],

            form: {
              id: Date.now(),
              brand: "iPhone",
              model: "",
              imageUrl: "",
              screen: { norm: "", gradA: "", orig: "", img: "" },
              battery: { price: "", img: "" },
              charge: { price: "", img: "" },
            },

            userForm: { name: "", code: "" },
          };
        },

        computed: {
          filteredModels() {
            if (!this.search) return this.models;
            const s = this.search.toLowerCase();
            return this.models.filter(
              (m) =>
                m.brand.toLowerCase().includes(s) ||
                m.model.toLowerCase().includes(s),
            );
          },
        },

        mounted() {
          const wait = setInterval(() => {
            if (window.FDB) {
              clearInterval(wait);
              this.initCloud();
            }
          }, 300);
        },

        methods: {
          getEmptyForm() {
            return {
              id: Date.now(),
              brand: "iPhone",
              model: "",
              imageUrl: "",
              screen: { norm: "", gradA: "", orig: "", img: "" },
              battery: { price: "", img: "" },
              charge: { price: "", img: "" },
            };
          },

          initCloud() {
            const { db, ref, onValue } = window.FDB;

            onValue(ref(db, "models"), (s) => {
              const d = s.val();
              this.models = d ? Object.values(d).reverse() : [];
            });

            onValue(ref(db, "users"), (s) => {
              const d = s.val() || {};
              this.userAccounts = {
                ...d,
                9988: { name: "เจ้าของร้าน", role: "Owner" },
              };
            });

            onValue(ref(db, "logs"), (s) => {
              const d = s.val();
              this.logs = d ? Object.values(d).reverse() : [];
            });
          },

          login() {
            const u = this.userAccounts[this.passcode];
            if (!u) {
              alert("รหัสไม่ถูกต้อง");
              this.passcode = "";
              return;
            }
            this.currentUser = { ...u, code: this.passcode };
            this.isLoggedIn = true;
            this.passcode = "";
            this.addLog("Login");
          },

          logout() {
            this.isLoggedIn = false;
            this.currentUser = null;
          },

          saveData() {
            if (!this.form.model) {
              alert("กรุณาระบุชื่อรุ่น");
              return;
            }
            const { db, ref, set } = window.FDB;
            set(ref(db, "models/" + this.form.id), this.form);
            this.addLog("Update model: " + this.form.model);
            this.form = this.getEmptyForm();
            this.editing = false;
          },

          deleteModel(id) {
            if (!confirm("ยืนยันลบ?")) return;
            const { db, ref, remove } = window.FDB;
            remove(ref(db, "models/" + id));
            this.addLog("Delete model: " + id);
          },

          saveUser() {
            if (!this.userForm.name || this.userForm.code.length < 4) {
              alert("ข้อมูลไม่ครบ");
              return;
            }

            const { db, ref, update, remove } = window.FDB;

            if (!this.isNewUser && this.oldCode !== this.userForm.code) {
              remove(ref(db, "users/" + this.oldCode));
            }

            update(ref(db, "users/" + this.userForm.code), {
              name: this.userForm.name,
              role: "Staff",
            });

            this.addLog("Update user: " + this.userForm.name);
            this.userEditing = false;
          },

          deleteUser(code) {
            if (!confirm("ลบพนักงาน?")) return;
            const { db, ref, remove } = window.FDB;
            remove(ref(db, "users/" + code));
            this.addLog("Delete user: " + code);
          },

          addLog(msg) {
            const { db, ref, push } = window.FDB;
            const now = new Date();
            push(ref(db, "logs"), {
              time:
                now.toLocaleDateString("th-TH") +
                " " +
                now.toLocaleTimeString("th-TH", {
                  hour: "2-digit",
                  minute: "2-digit",
                }),
              user: this.currentUser?.name || "System",
              action: msg,
            });
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
