<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>M-Shop-Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    margin: 0;
}
header {
    background: #ff6f00;
    color: #fff;
    padding: 12px 16px;
    font-size: 18px;
}
.container {
    padding: 16px;
}
input, button {
    padding: 8px;
    margin: 4px 0;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
}
th {
    background: #eee;
}
button {
    cursor: pointer;
}
.danger {
    background: #e53935;
    color: #fff;
    border: none;
}
.success {
    background: #43a047;
    color: #fff;
    border: none;
}
</style>
</head>

<body>
<header>📦 M-Shop-Check</header>

<div id="app" class="container" v-if="ready">
    <h3>👤 ผู้ใช้งาน</h3>

    <input v-model="userForm.code" placeholder="รหัสพนักงาน">
    <input v-model="userForm.name" placeholder="ชื่อพนักงาน">
    <br>
    <button class="success" @click="addUser">➕ เพิ่ม / แก้ไข</button>

    <table>
        <thead>
            <tr>
                <th>รหัส</th>
                <th>ชื่อ</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(u, code) in users" :key="code">
                <td>{{ code }}</td>
                <td>{{ u.name }}</td>
                <td>
                    <button class="danger" @click="deleteUser(code)">ลบ</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div v-else class="container">
    ⏳ กำลังโหลดระบบ...
</div>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "m-shop-check.firebaseapp.com",
    databaseURL: "https://m-shop-check-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "m-shop-check",
    storageBucket: "m-shop-check.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* expose ให้ Vue ใช้เหมือนเดิม */
window.FDB = {
    db,
    ref: firebase.database().ref,
    set: (r, v) => r.set(v),
    remove: (r) => r.remove(),
    onValue: (r, cb) => r.on("value", cb),
    push: (r, v) => r.push(v)
};

/* ================= VUE APP ================= */
const { createApp } = Vue;

createApp({
    data() {
        return {
            ready: false,
            users: {},
            userForm: { code: "", name: "" },
            currentUser: null
        };
    },

    mounted() {
        this.initCloud();
    },

    methods: {
        initCloud() {
            const { ref, onValue } = window.FDB;

            onValue(ref(db, "users"), snap => {
                this.users = snap.val() || {};
                this.ready = true;
            });
        },

        addUser() {
            if (!this.userForm.code || !this.userForm.name) {
                alert("กรอกข้อมูลให้ครบ");
                return;
            }
            const { ref, set } = window.FDB;
            set(ref(db, "users/" + this.userForm.code), {
                name: this.userForm.name
            });
            this.addLog("Add/Edit user: " + this.userForm.code);
            this.userForm = { code: "", name: "" };
        },

        deleteUser(code) {
            if (!confirm("ลบพนักงาน?")) return;
            const { ref, remove } = window.FDB;
            remove(ref(db, "users/" + code));
            this.addLog("Delete user: " + code);
        },

        addLog(msg) {
            const { ref, push } = window.FDB;
            const now = new Date();
            push(ref(db, "logs"), {
                time: now.toLocaleString("th-TH"),
                user: this.currentUser?.name || "System",
                action: msg
            });
        }
    }
}).mount("#app");
</script>

</body>
</html>
